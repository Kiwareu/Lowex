name: LowexNative
options:
  bundleIdPrefix: com.wenx
  deploymentTarget: {iOS: "15.0"}
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.7.6"
    CURRENT_PROJECT_VERSION: "54"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: "NO"
    PRODUCT_BUNDLE_IDENTIFIER: com.wenx.lowex
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: "NO"
targets:
  LowexNative:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        excludes: ["Info.plist", "BundledIcons/**", "Lang/**"]
      - path: Resources/BundledIcons
        type: folder
      - path: Resources/Lang
        type: folder
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Lowex
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, zh-Hant, en]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {UIColorName: LaunchBackground}
        UIAppFonts: [GreatVibes-Regular.ttf]
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest: {UIApplicationSupportsMultipleScenes: false}
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        LSApplicationQueriesSchemes:
          - shadowrocket
          - surge
          - quantumult-x
          - quantumultx
          - loon
          - stash
          - egern
          - sing-box
          - clash
          - clashx
          - karing
          - flclash
          - clashmeta
