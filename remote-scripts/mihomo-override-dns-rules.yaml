# ============================================================================
# 名称：Lowex 优化版 · Mihomo 覆写配置（DNS 防泄漏）
# 用途：给 ClashMi / Clash Verge Rev / Mihomo Party / FlClash 的「覆写 /
#       Override」入口添加的配置链接（.yaml）。
# 依据：官方文档（wiki.metacubex.one/config/dns）——nameserver-policy 优先于
#       nameserver/fallback 查询；境外 DoH 经 respect-rules 走代理加密。
#       本文件不再写 fallback。dns 整段替换，写覆写时必须写全段。
# 用法：在代理软件的「覆写 / Override」里「添加配置链接」，粘贴本文件 URL。
# 注意：本文件不含任何节点/订阅；节点仍由你自己的订阅提供。
# ============================================================================

dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  prefer-h3: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - '+.localdomain'
    - '+.arpa'
    - 'time.*.com'
    - 'ntp.*.com'
    - '+.pool.ntp.org'
    - '+.ntp.org'
    - 'time.*.gov'
    - 'time.*.apple.com'
    - '+.connectivitycheck.gstatic.com'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'captive.apple.com'
    - 'connectivitycheck.android.com'
    - 'detectportal.firefox.com'
    - 'nmcheck.gnome.org'
  respect-rules: true
  use-hosts: true
  use-system-hosts: false
  default-nameserver: [223.5.5.5, 119.29.29.29]
  nameserver: [https://1.1.1.1/dns-query, https://8.8.8.8/dns-query]
  proxy-server-nameserver: [https://223.5.5.5/dns-query, https://doh.pub/dns-query]
  direct-nameserver: [https://223.5.5.5/dns-query, https://doh.pub/dns-query]
  direct-nameserver-follow-policy: false
  nameserver-policy:
    'rule-set:gs_private': system
    'rule-set:gs_cn': [https://223.5.5.5/dns-query, https://doh.pub/dns-query]
# prepend-rules:
