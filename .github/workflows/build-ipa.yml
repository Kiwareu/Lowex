name: Build Lowex IPA (unsigned)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          ls /Applications | grep -i '^Xcode' || true
          NEW=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$NEW" ] && sudo xcode-select -s "$NEW/Contents/Developer" || true
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project LowexNative.xcodeproj -scheme LowexNative -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO clean build | tail -60
      - name: Package IPA
        run: |
          APP=$(find build/Build/Products -name "LowexNative.app" -maxdepth 3 | head -1)
          rm -rf Payload LowexNative.ipa && mkdir Payload && cp -R "$APP" Payload/
          brew install ldid || true
          which ldid && ldid -S "Payload/LowexNative.app/LowexNative" || true
          zip -qry LowexNative.ipa Payload
          unzip -l LowexNative.ipa | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: LowexNative-ipa
          path: native/LowexNative.ipa
      - name: Attach IPA to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp LowexNative.ipa Lowex-native.ipa
          gh release upload "${GITHUB_REF_NAME}" Lowex-native.ipa --clobber
